<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9953A;
    --gold-light: #E8B84B;
    --gold-dim: #8A6421;
    --bg: #0E0D0B;
    --surface: #1A1814;
    --surface2: #221F1A;
    --border: rgba(201,149,58,0.18);
    --text: #F2EBD9;
    --muted: #8A8070;
    --radius: 14px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  header {
    text-align: center;
    padding: 48px 24px 32px;
    position: relative;
  }

  header::after {
    content: '';
    display: block;
    width: 60px;
    height: 2px;
    background: var(--gold);
    margin: 20px auto 0;
    border-radius: 2px;
  }

  .logo-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    background: var(--surface2);
    margin-bottom: 16px;
  }

  .logo-badge svg { width: 36px; height: 36px; }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--text);
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
    font-weight: 300;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  main {
    padding: 0 16px;
    max-width: 480px;
    margin: 0 auto;
  }

  .brand-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .brand-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }

  .brand-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
    letter-spacing: -0.02em;
  }

  .brand-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
  }

  .brand-category {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  .chevron {
    color: var(--muted);
    font-size: 14px;
    transition: transform 0.25s;
    flex-shrink: 0;
  }

  .brand-card.open .chevron { transform: rotate(180deg); }

  .links-grid {
    display: none;
    padding: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .brand-card.open .links-grid { display: flex; }

  .social-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.07);
    background: var(--surface2);
    text-decoration: none;
    color: var(--text);
    font-size: 13px;
    font-weight: 400;
    flex: 1 1 calc(50% - 4px);
    min-width: 120px;
    transition: background 0.15s, border-color 0.15s;
  }

  .social-link:hover {
    background: #2a2620;
    border-color: var(--gold-dim);
  }

  .social-link:active { opacity: 0.75; }

  .social-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    opacity: 0.9;
  }

  .social-label {
    font-size: 12px;
    color: var(--muted);
    margin-left: auto;
  }

  /* Brand colours */
  .bc-cpp  { background: #1C1006; color: #C9953A; border: 1px solid #C9953A40; }
  .bc-mpp  { background: #0D1009; color: #7BBE4A; border: 1px solid #7BBE4A40; }
  .bc-cp   { background: #070C14; color: #4A8FD4; border: 1px solid #4A8FD440; }
  .bc-sup  { background: #110915; color: #B07FD4; border: 1px solid #B07FD440; }
  .bc-mg   { background: #0D1009; color: #D4A94A; border: 1px solid #D4A94A40; }
  .bc-oil  { background: #14100A; color: #E07A30; border: 1px solid #E07A3040; }

  footer {
    text-align: center;
    padding: 32px 24px 0;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
</style>
